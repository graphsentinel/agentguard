version: "3.8"

services:
  target-agent:
    build:
      context: ./src/target-agent
      dockerfile: Dockerfile
    container_name: agentguard-target-agent
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama.platform.localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agentguard-scanner:
    build:
      context: ./src/agentguard
      dockerfile: Dockerfile
    container_name: agentguard-scanner
    environment:
      - PATTERNS_PATH=/app/patterns/attack-patterns.json
    volumes:
      - ./patterns:/app/patterns:ro
    network_mode: host
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "9000"]
    depends_on:
      - target-agent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
