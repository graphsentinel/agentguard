apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: agentguard
---
# Prometheus configuration - scrapes AgentGuard scanner /metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'agentguard-scanner'
        metrics_path: /metrics
        static_configs:
          - targets: ['agentguard-scanner.agentguard-system.svc.cluster.local:8000']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=1h'
            - '--storage.tsdb.path=/prometheus'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
---
# Grafana datasource - points to Prometheus server
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: AgentGuard
        type: prometheus
        uid: agentguard-prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: AgentGuard
        folder: AgentGuard
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-agentguard
  namespace: monitoring
data:
  agentguard.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 0.8},
                  {"color": "green", "value": 0.9}
                ]
              },
              "unit": "percentunit",
              "max": 1
            }
          },
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"]},
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "Detection Rate",
          "type": "gauge",
          "targets": [{"expr": "agentguard_detection_rate", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            }
          },
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "title": "CI/CD Gate",
          "type": "stat",
          "targets": [{"expr": "agentguard_ci_gate", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "title": "Total Scans",
          "type": "stat",
          "targets": [{"expr": "agentguard_scans_total", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "percentunit"
            }
          },
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 8},
          "id": 4,
          "options": {
            "orientation": "horizontal",
            "showValue": "always"
          },
          "title": "Detection Rate by Category",
          "type": "bargauge",
          "targets": [{"expr": "agentguard_category_detection", "refId": "A", "legendFormat": "{{category}}"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 18},
          "id": 5,
          "title": "Total Attacks by Scan",
          "type": "timeseries",
          "targets": [{"expr": "agentguard_attacks_total", "refId": "A", "legendFormat": "{{scan_id}}"}]
        },
        {
          "datasource": {"type": "prometheus", "uid": "agentguard-prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 18},
          "id": 6,
          "title": "Successful Attacks by Scan",
          "type": "timeseries",
          "targets": [{"expr": "agentguard_attacks_successful", "refId": "A", "legendFormat": "{{scan_id}}"}]
        }
      ],
      "schemaVersion": 39,
      "tags": ["agentguard", "security", "ai-agents"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "AgentGuard Security Dashboard",
      "uid": "agentguard-main",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: agentguard
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/agentguard.json
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-agentguard
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-agentguard
          configMap:
            name: grafana-dashboard-agentguard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
