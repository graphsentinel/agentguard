apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-agent
  namespace: target-agent
  labels:
    app: target-agent
    app.kubernetes.io/name: target-agent
    app.kubernetes.io/part-of: agentguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-agent
  template:
    metadata:
      labels:
        app: target-agent
    spec:
      containers:
        - name: target-agent
          image: target-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: LLM_PROVIDER
              value: "ollama"
            - name: LLM_URL
              value: "http://ollama.platform.localhost:11434"
            - name: LLM_MODEL
              value: "llama3.2:1b"
            - name: LLM_API_KEY
              value: ""
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: target-agent
  namespace: target-agent
  labels:
    app: target-agent
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: target-agent
